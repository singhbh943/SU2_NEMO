%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Mach 15 viscous, ionized flow over a cylinder              %
%                   using the Gupta-Yos transport model.                       %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= NEMO_NAVIER_STOKES
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
AXISYMMETRIC= YES

% ----------- COMPRESSIBLE AND INCOMPRESSIBLE FREE-STREAM DEFINITION ----------%
%
MACH_NUMBER=23.9
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 19.7
FREESTREAM_TEMPERATURE= 254
FREESTREAM_TEMPERATURE_VE= 254
INIT_OPTION=TD_CONDITIONS

% ---- NONEQUILIBRIUM GAS, IDEAL GAS, POLYTROPIC, VAN DER WAALS AND PENG ROBINSON CONSTANTS -------%
%
FLUID_MODEL= MUTATIONPP
GAS_MODEL= air_11
IONIZATION= YES
GAS_COMPOSITION= (9.1430E-17,4.66871714E-13,5.33295047E-13,1.00018505E-12,9.33761714E-13,1.06660838E-12,1.0E-12,1.0E-12,1.0E-12,0.789999999993,0.21)

TRANSPORT_COEFF_MODEL= WILKE

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_ISOTHERMAL=(wall, 550.0)
MARKER_FAR= (farfield, outlet)
MARKER_SYM= (symm)
MARKER_PLOTTING= (wall)
MARKER_MONITORING= (wall)

%CATALYTIC_WALL= (wall)
%SUPERCATALYTIC_WALL= NO
%CATALYTIC_EFFICIENCY= 0.2

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.1
ITER= 1
LINEAR_SOLVER= BCGSTAB
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 5

% -----------------------------------------------------------------------%
%
CONV_NUM_METHOD_FLOW= AUSMPLUSUP2
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.01
TIME_DISCRE_FLOW= EULER_EXPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -40
CONV_STARTITER= 10

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= corse.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= restart_flow_gy.dat 
RESTART_FILENAME= restart_flow_gy.dat 
TABULAR_FORMAT= TECPLOT
CONV_FILENAME= convergence
VOLUME_FILENAME= soln_volume
SURFACE_FILENAME= soln_surface     
OUTPUT_WRT_FREQ= 100
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY_0, RMS_DENSITY_1, RMS_DENSITY_2, RMS_DENSITY_3, RMS_DENSITY_4, RMS_DENSITY_5, RMS_DENSITY_6, RMS_DENSITY_7, RMS_DENSITY_8, RMS_DENSITY_9, RMS_DENSITY_10, RMS_ENERGY, RMS_ENERGY_VE, LIFT, DRAG, TOTAL_HEATFLUX)
